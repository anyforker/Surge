name: Sync upstream modules

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-modules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate synced modules
        run: bash scripts/sync-upstream-modules.sh

      - name: Validate synced modules
        run: |
          bash -n scripts/sync-upstream-modules.sh
          awk -F '\t' 'NF && $1 !~ /^#/ { count[$1]++ } END { for (target in count) if (count[target] > 1) { print target; bad=1 } exit bad }' scripts/upstream-module-sources.tsv
          test "$(awk -F '\t' 'NF && $1 !~ /^#/ { count++ } END { print count+0 }' scripts/upstream-module-sources.tsv)" -eq 4

          while IFS=$'\t' read -r target source mode extra; do
            if [ -z "${target:-}" ] || [[ "$target" == \#* ]]; then
              continue
            fi
            test -z "${extra:-}"
            test -s "$target"
            [[ "$target" =~ ^module/[a-z0-9]+(-[a-z0-9]+)*\.sgmodule$ ]]
            [[ "$source" == https://* ]]
            case "${mode:-mirror}" in
              mirror|yfamilys-adblock|biliuniverse-adblock|spotify-enhancement|youtube-enhance-adblock) ;;
              *) exit 1 ;;
            esac
          done < scripts/upstream-module-sources.tsv

          npm test
          git diff --check

      - name: Commit and push changes
        run: |
          targets="$(awk -F '\t' 'NF && $1 !~ /^#/ { print $1 }' scripts/upstream-module-sources.tsv)"
          if [ -z "$(git status --porcelain -- $targets)" ]; then
            echo "No upstream module changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $targets
          git commit -m "Sync upstream modules"
          git push
